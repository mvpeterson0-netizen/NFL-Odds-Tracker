name: update

on:
  schedule:
    # Every 5 minutes at off-peak minutes to accelerate the research backfill.
    # The 60-minute pull window (2.5-3.5 h before kickoff) gets ~12 chances.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild site data even if nothing changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      site_changed: ${{ steps.run.outputs.site_changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install alert sender (web push)
        # The only package outside the standard library (Michael approved 2026-10-27). If it fails to
        # install, alerts by web push are skipped and everything else runs as usual.
        continue-on-error: true
        run: pip install -q pywebpush==2.5.0

      - name: Sync latest main before generating data
        if: github.ref == 'refs/heads/main'
        run: git pull --ff-only origin main

      - name: Run pipeline
        id: run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          ODDS_API_KEY_5: ${{ secrets.ODDS_API_KEY_5 }}
          ODDS_API_KEY_6: ${{ secrets.ODDS_API_KEY_6 }}
          ODDS_API_KEY_20K: ${{ secrets.ODDS_API_KEY_20K }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_BUILD: ${{ (inputs.force_build || github.event_name == 'push') && '1' || '0' }}
        run: python -m pipeline.run

      - name: Commit data and run log
        if: always()
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -q -m "data: scheduled update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed"; exit 1

      - name: Keep schedule enabled
        # GitHub disables scheduled workflows in public repos after 60 days without activity.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true

      - name: Stamp site version (so phones and browsers load new code right away)
        if: steps.run.outputs.site_changed == 'true' || github.event_name != 'schedule'
        # The version is a hash of the site's code files only, so it changes when the code changes,
        # not on every data update. Only the uploaded copy is stamped; nothing is committed.
        run: |
          V=$(cat site/*.html site/*.js site/*.css | sha256sum | cut -c1-10)
          sed -i -E "s/(src|href)=\"([a-z]+\.(js|css))\"/\1=\"\2?v=$V\"/g" site/index.html
          echo "$V" > site/version.txt
          grep -c "?v=$V" site/index.html

      - name: Upload site
        if: steps.run.outputs.site_changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.site_changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
