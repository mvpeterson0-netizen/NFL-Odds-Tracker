name: probe-books
# Throwaway probe (branch probe/books only; never merged).
on:
  push:
    branches: [probe/books]
    paths: ["probe/books_probe.py", ".github/workflows/probe-books.yml"]
permissions:
  contents: write
concurrency:
  group: probe-books
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          ODDS_API_KEY_20K: ${{ secrets.ODDS_API_KEY_20K }}
        run: python probe/books_probe.py
      - name: Commit result to this branch
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/result.json
          git commit -q -m "probe: books result" && git push -q origin HEAD:probe/books
