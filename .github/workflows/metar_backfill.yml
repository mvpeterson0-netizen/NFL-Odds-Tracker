name: METAR backfill (research)
# Historical game weather from airport station reports (Iowa Environmental Mesonet), 2016-2025, for calibrating the
# severe-weather thresholds. Manual only (workflow_dispatch). No Odds API credits. Writes data/metar_history/game_weather.csv.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metar-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download station reports and summarize each game
        run: python -m research.metar_backfill
      - name: Commit the result
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metar_history
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "research: historical station weather (METAR) by game"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed"; exit 1
