name: probe-espn-boxscore
on:
  push:
    branches: [probe/espn-boxscore]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ESPN scoreboard and finished-game summaries
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          os.makedirs("probe/out", exist_ok=True)
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.status, r.read()
          log = []
          st, body = get("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard")
          open("probe/out/scoreboard.json", "wb").write(body)
          log.append(f"scoreboard HTTP {st} {len(body)} bytes")
          sb = json.loads(body)
          for ev in sb.get("events", []):
              t = (ev.get("status") or {}).get("type") or {}
              log.append(f"{ev['id']} {ev.get('shortName')} state={t.get('state')} completed={t.get('completed')} detail={t.get('detail')}")
              if t.get("state") in ("post", "in"):
                  try:
                      st, b = get(f"https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event={ev['id']}")
                      open(f"probe/out/summary_{ev['id']}.json", "wb").write(b)
                      log.append(f"  summary HTTP {st} {len(b)} bytes")
                  except Exception as e:
                      log.append(f"  summary error {e}")
                  time.sleep(1)
          open("probe/out/log.txt", "w").write("\n".join(log) + "\n")
          print("\n".join(log))
          PY
      - name: Commit results to this probe branch
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out
          git commit -m "probe: ESPN box score capture" || true
          git push
