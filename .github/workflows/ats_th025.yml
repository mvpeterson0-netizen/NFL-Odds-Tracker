name: TH-025 ATS research
on:
  push:
    branches: [main]
    paths: ["research/ats_th025.py", "research/ats_th025_README.md", ".github/workflows/ats_th025.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ats-th025
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run historical study (no odds API credits)
        run: python -m research.ats_th025
      - name: Commit reports
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/challenger/ats_th025
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: TH-025 historical ATS results"
          git pull --rebase origin main
          git push origin HEAD:main
