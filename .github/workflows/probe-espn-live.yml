name: probe-espn-live
on:
  push:
    branches: [probe/espn-live]
    paths: [probe/espn_fixture.py, .github/workflows/probe-espn-live.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/espn_fixture.py
      - run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe/fixture_*.json
          git commit -m "probe results" || true
          git push || true
