name: probe-cfb
on:
  push:
    branches: [probe/cfb-history]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe (about 11 credits, one game)
        env:
          ODDS_API_KEY_20K: ${{ secrets.ODDS_API_KEY_20K }}
        run: python probe/cfb_probe.py
      - name: Save result on the probe branch
        if: always()
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/cfb_probe_result.json
          git commit -q -m "probe result" || exit 0
          git push -q origin HEAD:probe/cfb-history
